<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="wb-fav-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5EF2FF"/>
      <stop offset="55%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#5EF2FF"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded-square backdrop -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#0A0E1A"/>
