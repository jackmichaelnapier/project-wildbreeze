name: Auto-publish Field Guide article

# Runs every 2 days at 09:00 UTC. Calls Claude with web search,
# generates a fresh briefing on a trending small-business AI topic,
# commits to main, and refreshes the field-guide index + sitemap.

on:
  schedule:
    - cron: '0 9 */2 * *'    # 09:00 UTC, every 2nd day
  workflow_dispatch:           # manual trigger button in GitHub UI

permissions:
  contents: write              # to commit the new article

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Anthropic SDK
        run: pip install anthropic==0.40.0

      - name: Generate article via Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/scripts/auto_publish.py

      - name: Commit and push
        run: |
          git config user.name  "wildbreeze-bot"
          git config user.email "wildbreeze-bot@users.noreply.github.com"
          git add field-guide/ sitemap.xml
          # Skip if no changes (e.g. generation skipped because topic was duplicate)
          git diff --staged --quiet && echo "No changes, skipping commit." && exit 0
          git commit -m "field-guide: auto-publish briefing $(date +%Y-%m-%d)"
          git push
