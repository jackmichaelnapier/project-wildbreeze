<style>
:root{
  --bg-0:#06080F; --bg-1:#0A0E1A; --bg-2:#10172A;
  --ink:#F2F4FA; --ink-2:#B6BDD0; --ink-3:#6F7793;
  --line:rgba(255,255,255,0.08); --line-2:rgba(255,255,255,0.14);
  --cyan:#5EF2FF; --violet:#A78BFA;
  --serif:"Space Grotesk", system-ui, sans-serif;
  --sans:"Inter", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg-0);overflow-x:hidden;min-height:100vh}
body{
  background:transparent;color:var(--ink);font-family:var(--sans);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 20px;-webkit-font-smoothing:antialiased;
}
.field{position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(1100px 700px at 78% -10%, rgba(94,242,255,0.18), transparent 60%),
    radial-gradient(900px 600px at 12% 5%, rgba(167,139,250,0.18), transparent 60%),
    radial-gradient(1000px 700px at 50% 110%, rgba(94,242,255,0.10), transparent 60%),
    linear-gradient(180deg,#06080F 0%,#080B17 50%,#06080F 100%);
}
.grid{position:fixed;inset:0;z-index:-1;
  background-image:
    linear-gradient(to right,var(--line) 1px,transparent 1px),
    linear-gradient(to bottom,var(--line) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 30%, black 30%, transparent 80%);
  opacity:.55;pointer-events:none;
}

#gate{display:none;width:100%;max-width:440px}
#gate.shown{display:block}
.kicker{
  font-family:var(--mono);font-size:11px;text-transform:uppercase;
  letter-spacing:0.14em;color:var(--cyan);margin-bottom:14px;
}
.title{
  font-family:var(--serif);font-size:34px;font-weight:500;
  letter-spacing:-0.02em;line-height:1.1;color:var(--ink);
  margin-bottom:14px;
}
.title .accent{
  background:linear-gradient(110deg,var(--cyan) 20%,var(--violet) 80%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-style:italic;font-weight:400;
}
.lede{color:var(--ink-2);font-size:15px;line-height:1.55;margin-bottom:32px}
.gate-card{
  border:1px solid var(--line);border-radius:14px;
  background:rgba(255,255,255,0.025);
  padding:32px 30px;
}
.field-label{
  display:block;font-family:var(--mono);font-size:10.5px;
  text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-3);
  margin-bottom:8px;margin-top:18px;
}
.field-label:first-child{margin-top:0}
.gate-input{
  width:100%;background:transparent;border:none;
  border-bottom:1px solid rgba(255,255,255,0.22);
  padding:8px 0 10px;font-family:var(--sans);font-size:16px;
  color:var(--ink);outline:none;transition:border-color 180ms ease;
}
.gate-input:focus{border-bottom-color:var(--cyan)}
.gate-input.err{border-bottom-color:#ff6b6b;animation:flash 0.6s}
@keyframes flash{0%,100%{border-bottom-color:#ff6b6b}50%{border-bottom-color:rgba(255,255,255,0.22)}}
.gate-button{
  width:100%;margin-top:28px;padding:13px;
  background:transparent;color:var(--ink);
  border:1px solid var(--line-2);border-radius:8px;
  font-family:var(--mono);font-size:12px;
  text-transform:uppercase;letter-spacing:0.12em;
  cursor:pointer;transition:all 180ms ease;
}
.gate-button:hover{
  border-color:var(--cyan);color:var(--cyan);
  background:rgba(94,242,255,0.04);
}
.gate-button:disabled{opacity:0.5;cursor:wait}
.msg{
  margin-top:14px;font-family:var(--mono);font-size:11.5px;
  letter-spacing:0.04em;color:var(--ink-3);min-height:1em;
}
.msg.err{color:#ff8a8a}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}
.gate-card.shake{animation:shake 0.4s}
.foot{
  margin-top:22px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:0.06em;color:var(--ink-3);text-align:center;
}
.foot a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.1)}
.foot a:hover{color:var(--cyan)}
  /* WB-CLIENT-CSS-START */
  /* Client area pill (footer .legal) — managed by _inject_client_link.py */
  .client-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-2);
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 6px 14px;
    text-decoration: none;
    transition: all 180ms ease;
  }
  .client-link:hover {
    color: var(--cyan);
    border-color: rgba(94, 242, 255, 0.5);
    background: rgba(94, 242, 255, 0.04);
  }
  .client-link .arrow { color: var(--cyan); transition: transform 180ms ease; }
  .client-link:hover .arrow { transform: translateX(3px); }
  /* WB-CLIENT-CSS-END */
</style>

  <form id="gate-form" class="gate-card" autocomplete="off" novalidate>
    <label class="field-label" for="g-email">Email</label>
    <input id="g-email" class="gate-input" type="email" autocomplete="email" required>
    <label class="field-label" for="g-key">Access key</label>
    <input id="g-key" class="gate-input" type="password" autocomplete="current-password" required>
    <button id="g-submit" class="gate-button" type="submit">Decrypt</button>
    <div id="g-msg" class="msg" aria-live="polite"></div>
  </form>
  <p class="foot">WildBreeze · client area</p>
</div>

  var ITERS = 200000;

  function hexToBytes(hex){
    var out = new Uint8Array(hex.length/2);
    for (var i=0;i<out.length;i++) out[i] = parseInt(hex.substr(i*2,2),16);
    return out;
  }
  function b64ToBytes(b64){
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function decrypt(email, accessKey){
    var pwd = (email.toLowerCase().trim() + "|" + accessKey.trim());
    var baseKey = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pwd),
      { name: "PBKDF2" }, false, ["deriveKey"]);
    var aesKey = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: hexToBytes(BLOB.s), iterations: ITERS, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]);
    var pt = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: hexToBytes(BLOB.iv) },
      aesKey,
      b64ToBytes(BLOB.ct));
    return new TextDecoder().decode(pt);
  }

  function render(html){
    document.open();
    document.write(html);
    document.close();
  }

  async function tryUnlock(email, accessKey){
    try {
      var html = await decrypt(email, accessKey);
      try {
        sessionStorage.setItem("wb_auth", JSON.stringify({ e: email, k: accessKey }));
      } catch(_) { /* private mode etc. — fine, just no caching */ }
      render(html);
      return true;
    } catch(e) {
      return false;
    }
  }

  function showGate(){
    var g = document.getElementById("gate");
    if (g) g.classList.add("shown");
    var em = document.getElementById("g-email");
    if (em) em.focus();
  }

  function shake(){
    var card = document.querySelector(".gate-card");
    if (!card) return;
    card.classList.remove("shake");
    void card.offsetWidth;  // restart animation
    card.classList.add("shake");
  }

  function setMsg(text, isErr){
    var m = document.getElementById("g-msg");
    if (!m) return;
    m.textContent = text || "";
    m.className = "msg" + (isErr ? " err" : "");
  }

  // Wire up the form
  function attachForm(){
    var form = document.getElementById("gate-form");
    form.addEventListener("submit", async function(ev){
      ev.preventDefault();
      var email = document.getElementById("g-email").value;
      var key   = document.getElementById("g-key").value;
      var btn   = document.getElementById("g-submit");
      btn.disabled = true;
      setMsg("Decrypting…");
      var ok = await tryUnlock(email, key);
      if (!ok) {
        btn.disabled = false;
        setMsg("Access denied. Check your email and access key.", true);
        shake();
        document.getElementById("g-key").classList.add("err");
        setTimeout(function(){
          document.getElementById("g-key").classList.remove("err");
        }, 1000);
      }
    });
  }

  // On load: try silent unlock from sessionStorage
  (async function(){
    var cached = null;
    try {
      cached = JSON.parse(sessionStorage.getItem("wb_auth") || "null");
    } catch(_) {}
    if (cached && cached.e && cached.k) {
      var ok = await tryUnlock(cached.e, cached.k);
      if (ok) return;  // rendered
    }
    // Cold load — show gate
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function(){
        attachForm();
        showGate();
      });
    } else {
      attachForm();
      showGate();
    }
  })();
})();
